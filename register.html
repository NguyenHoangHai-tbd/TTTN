<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Tài Khoản Mới - OtoMarket</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20261016_purge">
    <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container justify-content-between">
      <a class="brand-logo" href="index.html">
        <img src="assets/images/logo.png" alt="OtoMarket" class="site-logo">
      </a>
      <a href="index.html" class="btn btn-outline-custom btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Quay lại trang chủ
      </a>
    </div>
  </nav>

  <!-- Register Main -->
  <main class="py-5 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          
          <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
            <div class="text-center mb-4">
              <img src="assets/images/logo-icon.png" alt="OtoMarket" class="mx-auto mb-3 d-block" style="width: 58px; height: 58px; object-fit: contain;">
              <h1 class="h4 fw-bold mb-1">Tạo tài khoản OtoMarket</h1>
              <p class="text-muted small">Đăng ký để đăng tin bán xe, lưu xe yêu thích và nhận hỗ trợ tốt nhất</p>
            </div>

            <!-- Form đăng ký -->
            <form id="register-form" onsubmit="handleRegisterSubmit(event)">
              
              <!-- Họ và tên -->
              <div class="mb-3">
                <label class="form-label small fw-bold">Họ và tên <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="reg-name" placeholder="Nguyễn Văn A" required>
                </div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label small fw-bold">Địa chỉ Email <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
                </div>
                <div class="form-text small">Email dùng để đăng nhập và nhận thông báo kiểm duyệt tin.</div>
              </div>

              <!-- Số điện thoại -->
              <div class="mb-3">
                <label class="form-label small fw-bold">Số điện thoại liên hệ <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-telephone"></i></span>
                  <input type="tel" class="form-control" id="reg-phone" placeholder="0988 123 456" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <!-- Mật khẩu -->
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="reg-password" minlength="6" placeholder="Tối thiểu 6 ký tự" required>
                  </div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="col-md-6">
                  <label class="form-label small fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="reg-confirm-password" minlength="6" placeholder="Nhập lại mật khẩu" required>
                  </div>
                </div>
              </div>

              <!-- Điều khoản -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms-agree" checked required>
                <label class="form-check-label small text-muted" for="terms-agree">
                  Tôi đồng ý với <a href="about.html" class="text-teal">Quy chế hoạt động</a> và <a href="about.html" class="text-teal">Chính sách bảo mật</a> của OtoMarket
                </label>
              </div>

              <!-- Nút Đăng ký -->
              <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold mb-3">
                <i class="bi bi-check2-circle me-1"></i> Hoàn tất đăng ký
              </button>
            </form>

            <div class="text-center mt-3 small text-muted">
              Đã có tài khoản? <a href="login.html" class="text-teal fw-semibold">Đăng nhập ngay</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js?v=20261016_purge"></script>
  <script>
    function handleRegisterSubmit(event) {
      event.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (!name || !email || !phone || !password || !confirmPassword) {
        showToast("Vui lòng điền đầy đủ các thông tin bắt buộc!", "error");
        return;
      }

      if (password !== confirmPassword) {
        showToast("Mật khẩu và xác nhận mật khẩu không trùng khớp!", "error");
        return;
      }

      if (password.length < 6) {
        showToast("Mật khẩu phải có độ dài tối thiểu 6 ký tự!", "warning");
        return;
      }

      // Đăng ký người dùng mới (đã có kiểm tra trùng email bên trong)
      const result = registerUser({
        name: name,
        email: email,
        phone: phone,
        password: password
      });

      if (!result.success) {
        showToast(result.message, "error");
        return;
      }

      // Tự động đăng nhập phiên cho tài khoản vừa tạo
      setLoggedInUser(result.user);
      showToast(`Đăng ký tài khoản thành công! Chào mừng ${result.user.name}`, "success");

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 900);
    }
  </script>
</body>
</html>
