<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Kiểm Tra Nút Kho Xe & Topbar Đồng Bộ</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { background-color: #F8FAFC; }
    .section-eyebrow-orange {
      color: #FF6B00;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 2px;
    }
  </style>
</head>
<body class="p-4">
  <div class="container bg-white p-4 rounded-4 shadow-sm mb-4">
    <div class="d-flex justify-content-between align-items-end mb-3 flex-wrap gap-2">
      <div>
        <span class="section-eyebrow-orange">DANH MỤC ĐỀ XUẤT</span>
        <h2 class="h5 fw-bold text-dark mb-0">Kho Xe Đang Chào Bán</h2>
      </div>

      <!-- Bộ lọc tab theo chuẩn phân loại: Ô tô cũ, Ô tô mới, Chính chủ, Xe điện -->
      <div class="d-flex align-items-center gap-1.5 flex-wrap" id="portal-car-tabs">
        <button type="button" class="portal-filter-tab active">
          Tất cả xe (8)
        </button>
        <button type="button" class="portal-filter-tab">
          Ô tô cũ (Lướt tuyển chọn)
        </button>
        <button type="button" class="portal-filter-tab">
          Ô tô mới (Chính hãng)
        </button>
        <button type="button" class="portal-filter-tab">
          <i class="bi bi-person-check me-1"></i> Chính chủ bán
        </button>
        <button type="button" class="portal-filter-tab">
          <i class="bi bi-lightning-charge-fill me-1 text-warning"></i> Xe điện EV
        </button>
      </div>
    </div>
    <div class="alert alert-success d-flex align-items-center gap-2 mb-0">
      <i class="bi bi-check-circle-fill fs-5"></i>
      <span>Các nút lọc danh mục xe đã được định dạng dạng thẻ Segmented Pill bo tròn hiện đại, phản hồi màu cam #FF6B00 khi chọn!</span>
    </div>
  </div>
</body>
</html>
