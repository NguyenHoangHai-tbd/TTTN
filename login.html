<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Đăng Nhập Tài Khoản - OtoMarket</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css?v=20261016_purge">
    <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-custom">
    <div class="container justify-content-between">
      <a class="brand-logo" href="index.html">
        <img src="assets/images/logo.png" alt="OtoMarket" class="site-logo">
      </a>
      <a href="index.html" class="btn btn-outline-custom btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Quay lại trang chủ
      </a>
    </div>
  </nav>

  <!-- Login Main -->
  <main class="py-5 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          
          <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
            <div class="text-center mb-4">
              <img src="assets/images/logo-icon.png" alt="OtoMarket" class="mx-auto mb-3 d-block" style="width: 58px; height: 58px; object-fit: contain;">
              <h1 class="h4 fw-bold mb-1">Đăng nhập OtoMarket</h1>
              <p class="text-muted small">Truy cập tài khoản để đăng tin và quản lý danh sách xe</p>
            </div>

            <!-- Thông báo khi chuyển hướng do chưa đăng nhập hoặc sai quyền -->
            <div id="auth-alert-box" class="alert alert-warning d-flex align-items-center gap-2 mb-3 py-2 px-3 small border-0" style="display: none; background-color: #FEF3C7; color: #92400E;">
              <i class="bi bi-shield-exclamation fs-5 flex-shrink-0"></i>
              <span id="auth-alert-text"></span>
            </div>

            <!-- Form đăng nhập -->
            <form id="login-form" onsubmit="handleLoginSubmit(event)">
              <div class="mb-3">
                <label class="form-label small fw-bold">Địa chỉ Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="login-email" placeholder="name@example.com" value="nam.nguyen@otomarket.vn" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label class="form-label small fw-bold">Mật khẩu</label>
                  <a href="#" class="small text-teal text-decoration-none" onclick="showToast('Vui lòng liên hệ hotline 1900 6868 hoặc hỗ trợ kỹ thuật để khôi phục mật khẩu!', 'info'); return false;">Quên mật khẩu?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="login-password" value="12345678" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility()">
                    <i class="bi bi-eye" id="pwd-toggle-icon"></i>
                  </button>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me" checked>
                <label class="form-check-label small text-muted" for="remember-me">
                  Ghi nhớ đăng nhập trên trình duyệt này
                </label>
              </div>

              <button type="submit" class="btn btn-teal w-100 py-2 fw-semibold mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập ngay
              </button>
            </form>

            <!-- Khối 1-Click Demo Accounts -->
            <div class="p-3 rounded-4 border mt-4" style="background-color: #F8FAFC;">
              <span class="small fw-bold text-dark d-flex align-items-center mb-2">
                <i class="bi bi-lightning-charge-fill text-warning me-1"></i> Đăng nhập nhanh 1-Click (Tài khoản mẫu):
              </span>
              <div class="d-grid gap-2">
                <button type="button" class="btn btn-sm text-start p-2 rounded-3 border d-flex align-items-center justify-content-between" style="background: #FFFFFF; border-color: #E2E8F0;" onclick="quickFillLogin('user')">
                  <div>
                    <i class="bi bi-person-circle me-1 text-teal"></i> <strong class="text-dark">Khách bán xe:</strong> <span class="text-muted">Nguyễn Hoàng Nam</span>
                  </div>
                  <span class="badge bg-teal-subtle text-teal border border-teal-subtle" style="font-size: 0.68rem;">Khách cá nhân / Môi giới</span>
                </button>
                <button type="button" class="btn btn-sm text-start p-2 rounded-3 border d-flex align-items-center justify-content-between" style="background: #FFFFFF; border-color: #E2E8F0;" onclick="quickFillLogin('admin')">
                  <div>
                    <i class="bi bi-shield-shaded me-1 text-primary"></i> <strong class="text-dark">Nhân viên Showroom:</strong> <span class="text-muted">Quản lý Showroom</span>
                  </div>
                  <span class="badge bg-primary-subtle text-primary border border-primary-subtle" style="font-size: 0.68rem;">Nhân viên Showroom</span>
                </button>
              </div>
            </div>

            <div class="text-center mt-4 small text-muted">
              Chưa có tài khoản? <a href="register.html" class="text-teal fw-semibold">Đăng ký tài khoản mới</a>
            </div>

          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js?v=20261016_purge"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Dọn sạch mọi redirect lưu tạm cũ
      try {
        localStorage.removeItem('otomarket_redirect_after_login');
        sessionStorage.removeItem('otomarket_redirect_after_login');
      } catch(e) {}

      // Kiểm tra thông báo phân quyền được lưu từ sessionStorage
      const authMessage = sessionStorage.getItem('otomarket_auth_message');
      if (authMessage) {
        const alertBox = document.getElementById('auth-alert-box');
        const alertText = document.getElementById('auth-alert-text');
        if (alertBox && alertText) {
          alertText.textContent = authMessage;
          alertBox.style.display = 'flex';
        }
        showToast(authMessage, 'warning');
        sessionStorage.removeItem('otomarket_auth_message');
      }
    });

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('login-password');
      const icon = document.getElementById('pwd-toggle-icon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwdInput.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    function quickFillLogin(role) {
      if (role === 'admin') {
        document.getElementById('login-email').value = 'admin@otomarket.vn';
        document.getElementById('login-password').value = 'admin123';
        handleDoLogin({
          name: "Quản lý Showroom",
          email: "admin@otomarket.vn",
          phone: "1900 6868",
          role: "admin",
          avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80"
        });
      } else {
        document.getElementById('login-email').value = 'nam.nguyen@otomarket.vn';
        document.getElementById('login-password').value = '12345678';
        handleDoLogin({
          name: "Nguyễn Hoàng Nam",
          email: "nam.nguyen@otomarket.vn",
          phone: "0912 345 678",
          role: "user",
          avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
        });
      }
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const name = email.split('@')[0].replace('.', ' ').toUpperCase();

      const user = {
        name: name || "Người Dùng Mẫu",
        email: email,
        phone: "0988 888 999",
        role: email.toLowerCase() === 'admin@otomarket.vn' ? "admin" : "user",
        avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80"
      };

      handleDoLogin(user);
    }

    function handleDoLogin(user) {
      setLoggedInUser(user);
      showToast(`Đăng nhập thành công! Chào mừng ${user.name} (${user.role === 'admin' ? 'Nhân viên Showroom' : 'Khách cá nhân / Môi giới'})`, "success");

      // Xóa triệt để mọi redirect lưu tạm cũ trên mọi bộ nhớ
      try {
        localStorage.removeItem('otomarket_redirect_after_login');
        sessionStorage.removeItem('otomarket_redirect_after_login');
      } catch(e) {}

      setTimeout(() => {
        // 1. Nếu là tài khoản Admin Showroom -> chuyển đến admin.html
        if (user.role === 'admin') {
          window.location.href = 'admin.html';
          return;
        }

        // 2. Mặc định đối với mọi tài khoản người dùng/khách: LUÔN LUÔN chuyển về Trang chủ index.html
        window.location.href = 'index.html';
      }, 400);
    }
  </script>
</body>
</html>
